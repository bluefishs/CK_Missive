# =============================================================================
# CK_Missive PostgreSQL 效能調優配置
# =============================================================================
# Version: 1.0.0
# Created: 2026-02-06
# Target: PostgreSQL 15 (Docker Alpine)
# Hardware: QNAP NAS / 開發機 (4-8 GB RAM)
#
# ⚠️ 2026-08-29 更正：**本檔在執行時沒有被讀取。**
#
# 原本的使用方式寫著「在 command 加入 `-c config_file=` 或 `-c include=`」——
# **那一半從來沒有做**。三份 compose 都掛載了本檔，但實測
# `SELECT source FROM pg_settings WHERE name='max_connections'` 回的是
# **`command line`**，也就是設定全部來自 compose 的 `-c` 參數，本檔一行都沒生效。
#
# 而那段指示本身也不可行：`-c config_file=` 會**整份取代** postgresql.conf
# （風險高），而 `include` 是設定檔內的指令、不是可以用 `-c` 傳的 GUC。
# ⇒ 這是典型的 Dead Config：檔案在、掛載在、內容看起來權威，
#   照著它排障會得到錯的結論。
#
# 本檔的新定位：**規格書（intent），不是機制。**
#   機制  = 三份 docker-compose 的 `-c key=value` 參數（實測生效）
#   規格  = 本檔（帶著每個值「為什麼是這個數字」的說明）
#   強制  = `scripts/checks/pg_tuning_ssot_audit.py`（weekly 88）
#           比對三份 compose 與本檔，任一處不一致即 RED
#
# ⇒ **改設定要同時改本檔與三份 compose**，稽核會確認你沒漏。
#
# ⚠️ 下方的 `Hardware: 4-8 GB RAM` 已與現況不符：實測本機 Docker 可用
#    **23.5 GB**，postgres 常態只用 405 MiB。這些值是為更小的機器調的，
#    2026-08-29 曾因 `max_connections=50` 用罄而使新連線全被拒
#    （既有連線仍在服務，故公網看起來是好的）。
#    **要不要放寬是獨立的決定，且需重啟 postgres**，不在本次整合範圍。
# =============================================================================

# ---------------------------------------------------------------------------
# 記憶體設定
# ---------------------------------------------------------------------------

# 共享緩衝區 — PostgreSQL 用於快取資料頁的記憶體
# 建議值: 系統 RAM 的 25% (4GB RAM → 1GB, 但容器限制下保守設定)
shared_buffers = 512MB

# 單次排序/雜湊操作可用記憶體
# 注意: 每個連線的每個操作都可能使用這麼多，需乘以 max_connections
work_mem = 16MB

# 維護操作 (VACUUM, CREATE INDEX) 可用記憶體
maintenance_work_mem = 128MB

# 有效快取大小 — 幫助查詢規劃器估算可用快取
# 應接近系統可用 RAM (含 OS 快取)
effective_cache_size = 1536MB

# ---------------------------------------------------------------------------
# 查詢規劃器設定
# ---------------------------------------------------------------------------

# SSD 儲存的隨機頁面讀取成本 (預設 4.0 是為 HDD 設計)
# SSD/NVMe 設為 1.1，讓規劃器更傾向使用索引掃描
random_page_cost = 1.1

# 平行查詢讀取成本
effective_io_concurrency = 200

# ---------------------------------------------------------------------------
# WAL (Write-Ahead Log) 設定
# ---------------------------------------------------------------------------

# WAL 緩衝區大小
wal_buffers = 16MB

# checkpoint 完成目標 (0-1.0)
# 較高值 = 更平滑的 I/O 但恢復較慢
checkpoint_completion_target = 0.9

# ---------------------------------------------------------------------------
# 連線設定
# ---------------------------------------------------------------------------

# 最大連線數 (需配合 SQLAlchemy pool_size + max_overflow)
# pool_size=10 + max_overflow=20 = 30 連線需求
max_connections = 100
# 2026-08-29 owner 核准 50 → 100。理由與證據：
#   · 當日 50 條用罄，新連線全被拒（既有連線仍在服務 ⇒ 公網看起來是好的，
#     那正是它難以被發現的原因）
#   · 觸發來源是**多次部署留下的舊 backend 連線池**加上檢核腳本，
#     不是使用者流量 —— 但那些都是常態作業，會再發生
#   · 本檔原標「Hardware: 4-8 GB RAM」，實測本機 Docker 可用 **23.5 GB**、
#     postgres 常態只用 405 MiB ⇒ 這組值是為一台不存在的小機器調的
#   · 100 × work_mem 16MB 最壞情形約 1.6 GB，加 shared_buffers 512MB
#     仍遠低於可用記憶體
# ⚠️ 改這個值**必須重建 postgres 容器**才會生效（不是 restart，
#    因為值寫在 compose 的 command 裡）。weekly 88 第 ③ 層會抓「改了沒套用」。

# ---------------------------------------------------------------------------
# 日誌設定 (效能相關)
# ---------------------------------------------------------------------------

# 記錄慢查詢 (超過 500ms)
log_min_duration_statement = 500

# 記錄鎖等待
log_lock_waits = on

# 記錄臨時檔案使用 (排序溢出到磁碟)
log_temp_files = 0

# ---------------------------------------------------------------------------
# 自動清理 (Autovacuum) 調優
# ---------------------------------------------------------------------------

# 自動清理啟用
autovacuum = on

# 同時運行的 autovacuum worker 數量
autovacuum_max_workers = 3

# 較積極的清理閾值 (預設 50)
autovacuum_vacuum_threshold = 25

# 較積極的分析閾值 (預設 50)
autovacuum_analyze_threshold = 25

# ---------------------------------------------------------------------------
# 其他效能設定
# ---------------------------------------------------------------------------

# 預設統計目標 (影響 ANALYZE 精確度)
default_statistics_target = 200

# 時區
timezone = 'Asia/Taipei'

# 確保 pg_trgm 等擴展可用
# (擴展在 init.sql 中建立)
