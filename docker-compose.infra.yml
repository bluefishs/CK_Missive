# =============================================================================
# CK_Missive - 基礎設施專用 Docker Compose
# =============================================================================
# 目標：僅運行 PostgreSQL + Redis，搭配 PM2 管理應用服務（混合開發模式）
#
# 使用方式：
#   啟動基礎設施:  docker compose -f docker-compose.infra.yml up -d
#   停止基礎設施:  docker compose -f docker-compose.infra.yml down
#   查看狀態:      docker compose -f docker-compose.infra.yml ps
#
# 搭配 PM2:
#   pm2 start ecosystem.config.js
#
# 或使用統一腳本:
#   .\scripts\dev-start.ps1
#
# Version: 1.0.0
# Created: 2026-02-09
# =============================================================================

name: ${COMPOSE_PROJECT_NAME}_infra

services:
  # --- PostgreSQL 資料庫服務 ---
  postgres:
    image: pgvector/pgvector:0.8.0-pg15
    container_name: ${COMPOSE_PROJECT_NAME}_postgres_dev
    env_file: .env
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_CONTAINER_PORT}"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./configs/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./configs/postgresql-tuning.conf:/etc/postgresql/tuning.conf:ro
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "effective_cache_size=1536MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "idle_in_transaction_session_timeout=60000"
      - "-c"
      - "log_min_duration_statement=500"
      - "-c"
      - "log_lock_waits=on"
      - "-c"
      - "log_temp_files=0"
      - "-c"
      - "default_statistics_target=200"
      - "-c"
      - "timezone=Asia/Taipei"
    networks:
      - ck_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis 快取服務 ---
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME}_redis_dev
    ports:
      - "${REDIS_HOST_PORT}:${REDIS_CONTAINER_PORT}"
    volumes:
      - redis_dev_data:/data
    networks:
      - ck_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # --- 🤖 Ollama AI 服務 (Embedding + Chat) ---
  # GPU 加速：需要 NVIDIA GPU + nvidia-container-toolkit
  # 無 GPU 環境：使用 docker-compose.infra.cpu.yml override 或移除 deploy.resources.reservations.devices
  ollama:
    image: ollama/ollama:latest
    container_name: ${COMPOSE_PROJECT_NAME}_ollama_dev
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=30m
    volumes:
      - ollama_dev_data:/root/.ollama
    networks:
      - ck_network
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 12G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # --- 🧠 vLLM 本地推理服務 (取代 NIM TRT-LLM) ---
  # 原因：NIM 1.8.3 自動選擇 TRT-LLM，RTX 4060 8GB 無法完成 engine build
  # vLLM 直接提供 OpenAI-compatible API，啟動快、VRAM 效率高
  # 啟動：docker compose -f docker-compose.infra.yml --profile vllm up -d vllm
  # VRAM 策略：vLLM ~5GB + Ollama embedding 0.6GB = 5.6GB / 8GB RTX 4060
  #   → Ollama chat 模型 (qwen3:4b 3.3GB) 會在 vLLM 啟動後自動卸載 (KEEP_ALIVE 到期)
  vllm:
    image: vllm/vllm-openai:latest
    container_name: ${COMPOSE_PROJECT_NAME}_vllm_dev
    ports:
      - "${VLLM_HOST_PORT:-8000}:8000"
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN:-}
    volumes:
      - vllm_dev_cache:/root/.cache/huggingface
    networks:
      - ck_network
    restart: unless-stopped
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      --dtype bfloat16
      --max-model-len 4096
      --gpu-memory-utilization 0.85
      --port 8000
      --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 12G
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    profiles:
      - vllm

  # --- ☁️ Cloudflare Tunnel（ADR-0015/0016，Docker 模式）---
  # CF Dashboard 建立 tunnel 後取得 token，設於 .env 的 CF_TUNNEL_TOKEN
  # 路由到 host 上的 PM2 backend (host.docker.internal:8001)
  # 啟動：docker compose -f docker-compose.infra.yml up -d cloudflared
  cloudflared:
    # v6.10.3 (2026-05-21)：固定版本 + 升級 2026.3.0 → 2026.5.0
    # 解 QUIC datagram/stream timeout chronic（5/19+5/20 多次 reconnect）
    # latest tag 不可靠 — CF 偶爾不更新 latest（之前停在 2026.3.0）
    image: cloudflare/cloudflared:2026.5.0
    container_name: ${COMPOSE_PROJECT_NAME}_cloudflared
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
      # P4 配套：cloudflared metrics 暴露於 :2000/metrics 供 Prometheus scrape
      - TUNNEL_METRICS=0.0.0.0:2000
    ports:
      # P4：曝 metrics 給 Prometheus（不對外，僅 docker network 內）
      - "127.0.0.1:9114:2000"
    networks:
      - ck_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "localhost:host-gateway"
    restart: unless-stopped      # ⚠️ 2026-08-19：這裡原本是 `test: ["CMD","cloudflared","tunnel","info"]`，
      #    但那個指令**必定失敗** —— `tunnel info` 需要一個 tunnel ID/名稱參數：
      #      "cloudflared tunnel info" accepts exactly one argument
      #    也就是說這份 compose 一旦真的被拿去 up，會產生一個**永遠 unhealthy**
      #    的容器。（實測方式：docker exec ck_missive_cloudflared cloudflared tunnel info）
      #
      #    已移除而不是換一個 —— 因為這個 image 是 distroless（連 ls 都沒有），
      #    docker healthcheck 無法發 HTTP 請求，做不出真正的健康探測。
      #    lvrland 那份寫 `cloudflared --version` 是**有意識的取捨**（見該檔 2026-05-22
      #    註解：已知 distroless 無 /bin/sh，故退而求其次證明 binary 還能執行）。
      #    它偵測得到「行程死掉」，但偵測不到「隧道與 Cloudflare 斷線」——
      #    而後者才是會讓公網 502 的那個。不是錯，是不夠。
      #
      #    真正的健康訊號改由**主機側**探 TUNNEL_METRICS 的 /ready
      #    （隧道有活躍連線時才回 200），見
      #    CK_Website/scripts/check-restart-resilience.cjs 的 HTTP_HEALTH_PATHS。
      #    這裡選擇不放 healthcheck，而不是放一個測不到真實故障的 ——
      #    缺少訊號是誠實的，假訊號會讓人在排查時把這一項劃掉。
    profiles:
      - tunnel

# --- 持久化儲存（與 docker-compose.dev.yml 共享） ---
volumes:
  postgres_dev_data:
    name: ${COMPOSE_PROJECT_NAME}_postgres_dev_data
  # 2026-05-21 L43 收斂：對齊 production compose 的 redis volume name（cross-file SSOT）
  # 原 ${COMPOSE_PROJECT_NAME}_redis_dev_data 已 orphan，可日後 docker volume rm 清
  redis_dev_data:
    name: ck_missive_redis_data
    external: true
  ollama_dev_data:
    name: ${COMPOSE_PROJECT_NAME}_ollama_dev_data
  vllm_dev_cache:
    name: ${COMPOSE_PROJECT_NAME}_vllm_dev_cache

# --- 網路配置（與 docker-compose.dev.yml 共享） ---
networks:
  # ⚠️ 2026-08-20：這個鍵原本叫 app_network，導致這份 compose **完全無法使用**。
  #    docker 會把 compose 的網路鍵寫成 `com.docker.compose.network` 標籤，
  #    而 ck_missive_network 是 docker-compose.production.yml 以鍵 `ck_network`
  #    建立的，標籤就是 ck_network。用 app_network 宣告同一個網路時：
  #      network ck_missive_network was found but has incorrect label
  #      com.docker.compose.network set to "ck_network" (expected: "app_network")
  #    → 這份檔案裡的 postgres / redis / ollama / cloudflared 一律起不來。
  #
  #    這是在真的嘗試切換 cloudflared 時才炸出來的（切換失敗、已回退）。
  #    改名而不是用 external: true —— 本檔含 postgres/redis，要能獨立啟動；
  #    改名後誰先建都可以，標籤一致。
  ck_network:
    name: ck_missive_network
    driver: bridge
  # nemoclaw_network: 已移除 (ADR-0015, 2026-04-16)
